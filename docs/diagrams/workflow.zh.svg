<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1040" viewBox="0 0 1040 1040" role="img" aria-labelledby="title desc">
  <title id="title">ObjectAutoLabel 操作流程</title>
  <desc id="desc">本機與生成式影像經多組平行的偽標註、人工校正及增強，加入選用的 Open Data 後切分、訓練、驗證、轉換匯出及推論。驗證結果回饋下一輪資料與標註迭代。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <rect width="1040" height="1040" fill="#ffffff"/>
  <g font-family="Arial, Noto Sans CJK TC, sans-serif">
    <text x="48" y="38" font-size="24" font-weight="600" fill="#0f172a">從資料到可部署的物件偵測模型</text>
    <rect x="48" y="306" width="628" height="330" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="72" y="330" font-size="17" fill="#475569">平行組合</text>
    <g fill="none" stroke="#64748b" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)">
      <path d="M188 142V164H360V184"/>
      <path d="M523 142V184"/>
      <path d="M442 256V282H206V344"/>
      <path d="M442 256V282H518V344"/>
      <path d="M206 410V444"/>
      <path d="M518 410V444"/>
      <path d="M206 510V544"/>
      <path d="M518 510V544"/>
      <path d="M206 610V664H430V700"/>
      <path d="M518 610V700"/>
      <path d="M868 142V444"/>
      <path d="M868 510V736H720"/>
      <path d="M510 772V796H316V828"/>
      <path d="M468 864H568"/>
      <path d="M720 900V944"/>
      <path d="M568 980H468"/>
      <path d="M568 884H536V922H20V220H210" stroke-dasharray="7 5"/>
    </g>
    <text transform="translate(36 728) rotate(-90)" font-size="16" fill="#475569">迭代：補充資料／校正標註</text>
    <g data-node="media"><rect x="48" y="70" width="280" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="188" y="97" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">圖片／影片</text>
      <text x="188" y="120" text-anchor="middle" font-size="16" fill="#475569">本機原始資料</text>
    </g>
    <g data-node="generated"><rect x="372" y="70" width="302" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="523" y="97" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">生成式影像</text>
      <text x="523" y="120" text-anchor="middle" font-size="16" fill="#475569">ComfyUI／MiniMax H3</text>
    </g>
    <g data-node="public"><rect x="744" y="70" width="248" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="868" y="97" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">公開資料集</text>
      <text x="868" y="120" text-anchor="middle" font-size="16" fill="#475569">VisDrone／Platform</text>
    </g>
    <g data-node="sources"><rect x="210" y="184" width="464" height="72" rx="10" fill="#e8f0fe" stroke="#94a3b8"/>
      <text x="442" y="211" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Projects → Sources</text>
      <text x="442" y="234" text-anchor="middle" font-size="16" fill="#475569">指定來源版本＋提交類別設定</text>
    </g>
    <g data-node="pseudo-a"><rect x="72" y="344" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="206" y="371" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Pseudo · A</text>
      <text x="206" y="394" text-anchor="middle" font-size="16" fill="#475569">世界模型＋提示詞偽標註</text>
    </g>
    <g data-node="pseudo-b"><rect x="384" y="344" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="518" y="371" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Pseudo · B</text>
      <text x="518" y="394" text-anchor="middle" font-size="16" fill="#475569">另一組來源／版本</text>
    </g>
    <g data-node="review-a"><rect x="72" y="444" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="206" y="471" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Review · A</text>
      <text x="206" y="494" text-anchor="middle" font-size="16" fill="#475569">校正、沿用、保存</text>
    </g>
    <g data-node="review-b"><rect x="384" y="444" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="518" y="471" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Review · B</text>
      <text x="518" y="494" text-anchor="middle" font-size="16" fill="#475569">校正、沿用、保存</text>
    </g>
    <g data-node="augment-a"><rect x="72" y="544" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="206" y="571" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Augment／Skip · A</text>
      <text x="206" y="594" text-anchor="middle" font-size="16" fill="#475569">增強或保留原始標註</text>
    </g>
    <g data-node="augment-b"><rect x="384" y="544" width="268" height="66" rx="10" fill="#ffffff" stroke="#94a3b8"/>
      <text x="518" y="571" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Augment／Skip · B</text>
      <text x="518" y="594" text-anchor="middle" font-size="16" fill="#475569">增強或保留原始標註</text>
    </g>
    <g data-node="open"><rect x="744" y="444" width="248" height="66" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="868" y="471" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Open Data（選用）</text>
      <text x="868" y="494" text-anchor="middle" font-size="16" fill="#475569">類別映射＋取樣</text>
    </g>
    <g data-node="split"><rect x="300" y="700" width="420" height="72" rx="10" fill="#e5f4ec" stroke="#94a3b8"/>
      <text x="510" y="727" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">組合 → Split</text>
      <text x="510" y="750" text-anchor="middle" font-size="16" fill="#475569">多組相加＋公開資料・建立切分版本</text>
    </g>
    <g data-node="train"><rect x="164" y="828" width="304" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="316" y="855" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Train</text>
      <text x="316" y="878" text-anchor="middle" font-size="16" fill="#475569">選擇 YOLO 架構與訓練參數</text>
    </g>
    <g data-node="validate"><rect x="568" y="828" width="304" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="720" y="855" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Validate</text>
      <text x="720" y="878" text-anchor="middle" font-size="16" fill="#475569">抽樣檢查＋真實場景驗證</text>
    </g>
    <g data-node="export"><rect x="568" y="944" width="304" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="720" y="971" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Convert &amp; Export</text>
      <text x="720" y="994" text-anchor="middle" font-size="16" fill="#475569">PT／ONNX／LiteRT FP32</text>
    </g>
    <g data-node="stream"><rect x="164" y="944" width="304" height="72" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
      <text x="316" y="971" text-anchor="middle" font-size="20" font-weight="600" fill="#0f172a">Stream Demo</text>
      <text x="316" y="994" text-anchor="middle" font-size="16" fill="#475569">攝影機／影片推論</text>
    </g>
  </g>
</svg>
