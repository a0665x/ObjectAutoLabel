services:
  object-autolabel:
    build:
      context: .
      dockerfile: Dockerfile.jetson
      args:
        BASE_IMAGE: ${JETSON_BASE_IMAGE:-nvcr.io/nvidia/pytorch:25.06-py3-igpu}
    image: object-autolabel:jetson
    container_name: object-autolabel
    runtime: nvidia
    network_mode: host
    shm_size: "2gb"
    volumes:
      - ./data:/app/data
      - ./runs:/app/runs
      - ./logs:/app/logs
      - ./world_model:/app/world_model:ro
      - ./input_model:/app/input_model:ro
      - ./output_model:/app/output_model
      - ./cli_workspace:/app/cli_workspace
      - /home/a0665x/Desktop/AI_AGX_WS/autolabel:/home/a0665x/Desktop/AI_AGX_WS/autolabel:rw
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - YOLO_CONFIG_DIR=/tmp/ultralytics
      - OBJECT_AUTOLABEL_CLI_ENABLED=${OBJECT_AUTOLABEL_CLI_ENABLED:-true}
      - OBJECT_AUTOLABEL_BIND_HOST=${OBJECT_AUTOLABEL_BIND_HOST:-127.0.0.1}
      - OBJECT_AUTOLABEL_AUTH_ENABLED=${OBJECT_AUTOLABEL_AUTH_ENABLED:-false}
      - OBJECT_AUTOLABEL_SESSION_SECRET=${OBJECT_AUTOLABEL_SESSION_SECRET:-}
      - OBJECT_AUTOLABEL_PUBLIC_URL=${OBJECT_AUTOLABEL_PUBLIC_URL:-}
      - ULTRALYTICS_API_KEY=${ULTRALYTICS_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - FACEBOOK_CLIENT_ID=${FACEBOOK_CLIENT_ID:-}
      - FACEBOOK_CLIENT_SECRET=${FACEBOOK_CLIENT_SECRET:-}
      - LINE_CLIENT_ID=${LINE_CLIENT_ID:-}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET:-}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
